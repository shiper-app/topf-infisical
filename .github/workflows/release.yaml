jobs:
  cli:
    name: Release topf-infisical 
    permissions:
      contents: write
    env:
      NODE_USE_ENV_PROXY: "1"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # - name: Create GHA Token for private repo access
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   id: app-token
      #   with:
      #     client-id: ${{ vars.GHA_KUB_AUTOMATION_APP_ID }}
      #     private-key: ${{ secrets.GHA_KUB_AUTOMATION_APP_PRIVATE_KEY }}
      #     owner: postch
      #     permission-contents: write
      #
      # - name: Configure Github creds to download private modules
      #   shell: bash
      #   env:
      #     GITHUB_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
      #     GITHUB_APP: ${{ vars.GHA_KUB_AUTOMATION_APP_ID }}
      #   run: |
      #     git config --global url."https://${GITHUB_APP}:${GITHUB_ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --verbose
